<!DOCTYPE html>
<html lang="en" style="--bg-dark: #05070b; --card-bg: #0d111a; --border-color: #161e2e;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚽ Football Tracker & Tactics Pro</title>
    <style>
        :root {
            --bg-dark: #05070b;
            --card-bg: #0d111a;
            --border-color: #161e2e;
            --accent-color: #0056b3;
        }
        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .login-select, .amazon-btn, .stop-btn {
            background-color: var(--card-bg);
            color: #ffffff;
            border: 1px solid var(--border-color);
            padding: 12px;
            margin: 10px 0;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
        }
        .amazon-btn {
            background-color: var(--accent-color);
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .stop-btn {
            background-color: #b30000;
            border: none;
            font-weight: bold;
            cursor: pointer;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .login-desc {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 15px;
        }
        .football-pitch {
            background: #0a2e13;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="login-desc">
        Enter your name and details. GPS & Motion permission prompt will trigger to enable tracking.
    </div>

    <div class="form-group">
        <!-- aria-label added for accessibility, UI layout is untouched -->
        <select id="regPosition" class="login-select" aria-label="Select Player Position">
            <option value="LW">Left Winger (LW)</option>
            <option value="RW">Right Winger (RW)</option>
            <option value="ST">Striker (ST)</option>
            <option value="CM">Central Midfielder (CM)</option>
        </select>
    </div>

    <div class="form-group">
        <!-- aria-label added for accessibility, UI layout is untouched -->
        <select id="regTier" class="login-select" aria-label="Select Academy Tier">
            <option value="Elite">Elite Pro Prospect</option>
            <option value="U19">U-19 Academy Squad</option>
        </select>
    </div>

    <div class="football-pitch" id="tacticalPitchBox">
        🚀 Tactical Vector: CM is moving forward with ball → Pass to LW marker.
    </div>

    <button class="amazon-btn" onclick="startTrainingTimer()" aria-label="Start Training Session">Start Training Session ⏱️</button>
    <button class="stop-btn" onclick="stopTrainingTimer()" aria-label="Stop Training Session">Stop Training Session ⏹️</button>
    
    <a href="https://www.amazon.com" target="_blank" class="amazon-btn" style="display:block; text-align:center; text-decoration:none; line-height: normal;" aria-label="Visit Amazon Link">Visit Amazon ↗</a>

    <script>
        function startTrainingTimer() {
            console.log("Training session started successfully!");
            alert("Training Session Started! ⏱️");
        }
        function stopTrainingTimer() {
            console.log("Training session stopped!");
            alert("Training Session Stopped! ⏹️");
        }
    </script>
</body>
</html>
